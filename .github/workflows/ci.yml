name: CI/CD Pipeline

on:
  push:
    branches:
      - main          # triggers the full pipeline (test + deploy) on merge
  pull_request:
    branches:
      - main          # triggers tests only on PRs targeting main

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PORT: ${{ secrets.PORT }}
        working-directory: ./backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

  deploy:
    name: Deploy to EC2
    needs: test                          # only runs if test job passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Stop PM2
        run: pm2 stop all || true

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies and Build
        working-directory: ./frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          sudo rm -rf ./dist
          npm ci
          npm run build

      - name: Write production .env
        run: |
          cd ./backend
          touch .env
          echo "${{ secrets.PROD }}" > .env

      - name: Start and Restart PM2
        working-directory: ./backend
        run: |
          pm2 describe backend > /dev/null 2>&1 && pm2 restart backend || pm2 start "npm run start" --name="backend"
          pm2 delete Frontend 2>/dev/null || true
          pm2 serve ../frontend/dist 3000 --name="Frontend" --spa
          pm2 save

      - name: Reload nginx
        run: sudo systemctl reload nginx
