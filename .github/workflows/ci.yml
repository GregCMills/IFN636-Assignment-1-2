name: CI/CD Pipeline

on:
  push:
    branches:
      - ops/load_balancing          # triggers the full pipeline (test + deploy) on merge
  pull_request:
    branches:
      - main          # triggers tests only on PRs targeting main

jobs:
  # Run all the tests
  test:
    name: Run Tests
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Typecheck Backend
        working-directory: ./backend
        run: npm run typecheck

      - name: Run Backend Tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PORT: ${{ secrets.PORT }}
        working-directory: ./backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

  # If the tests pass, and this is being pushed to main, deploy to the EC2
  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Stop PM2
        run: pm2 stop all || true

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Install Frontend Dependencies and Build
        working-directory: ./frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          sudo rm -rf ./dist
          npm ci
          npm run build

      - name: Write production .env
        run: |
          cd ./backend
          touch .env
          echo "${{ secrets.PROD }}" > .env

      - name: Start and Restart PM2
        working-directory: ./backend
        run: |
          pm2 describe backend > /dev/null 2>&1 && pm2 restart backend || pm2 start "npm run start" --name="backend"
          sudo mkdir -p /var/www/app/frontend/dist
          sudo rm -rf /var/www/app/frontend/dist/*
          sudo cp -r ../frontend/dist/. /var/www/app/frontend/dist/
          pm2 delete Frontend 2>/dev/null || true
          pm2 save

      - name: Install and reload nginx config
        run: |
          sudo cp ./nginx.conf /etc/nginx/sites-available/app
          sudo ln -sfn /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
          sudo nginx -t
          sudo systemctl reload nginx
        
  # If the tests pass, and this is pushed to main, deploy to two VPS hosts sequentially
  deploy-vps:
    name: Deploy to VPS
    needs: test                          # only runs if test job passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (composite action from repo)
        uses: actions/checkout@v3

      - name: Deploy via SSH (server 1)
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          ssh_key: ${{ secrets.DO_SSH_KEY }}
          github_repository: ${{ github.repository }}
          vite_clerk_publishable_key: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          prod_env: ${{ secrets.PROD }}

      - name: Deploy via SSH (server 2)
        uses: ./.github/actions/deploy-vps
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          ssh_key: ${{ secrets.EC2_SSH_KEY }}
          github_repository: ${{ github.repository }}
          vite_clerk_publishable_key: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          prod_env: ${{ secrets.PROD }}
