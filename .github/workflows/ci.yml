name: CI/CD Pipeline

on:
  push:
    branches:
      - main          # triggers the full pipeline (test + deploy) on merge
  pull_request:
    branches:
      - main          # triggers tests only on PRs targeting main

jobs:
  # Run all the tests
  test:
    name: Run Tests
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Typecheck Backend
        working-directory: ./backend
        run: npm run typecheck

      - name: Run Backend Tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PORT: ${{ secrets.PORT }}
        working-directory: ./backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

  # If the tests pass, and this is being pushed to main, deploy to the EC2
  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Stop PM2
        run: pm2 stop all || true

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Install Frontend Dependencies and Build
        working-directory: ./frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          sudo rm -rf ./dist
          npm ci
          npm run build

      - name: Write production .env
        run: |
          cd ./backend
          touch .env
          echo "${{ secrets.PROD }}" > .env

      - name: Start and Restart PM2
        working-directory: ./backend
        run: |
          pm2 describe backend > /dev/null 2>&1 && pm2 restart backend || pm2 start "npm run start" --name="backend"
          sudo mkdir -p /var/www/app/frontend/dist
          sudo rm -rf /var/www/app/frontend/dist/*
          sudo cp -r ../frontend/dist/. /var/www/app/frontend/dist/
          pm2 delete Frontend 2>/dev/null || true
          pm2 save

      - name: Install and reload nginx config
        run: |
          sudo cp ./nginx.conf /etc/nginx/sites-available/app
          sudo ln -sfn /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
          sudo nginx -t
          sudo systemctl reload nginx
        
  # If the tests pass, and this is being pushed to main, deploy to a digital ocean droplet
  deploy-digitalocean:
    name: Deploy to DigitalOcean
    needs: test                          # only runs if test job passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # Install Node.js 22 if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install PM2 globally if not present
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Install nginx if not present
            if ! command -v nginx &> /dev/null; then
              sudo apt-get install -y nginx
            fi

            # Clone repo on first run, otherwise pull latest
            if [ ! -d "/var/www/app" ]; then
              git clone https://github.com/${{ github.repository }}.git /var/www/app
            fi

            cd /var/www/app
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies and build backend + frontend
            cd backend && npm ci && npm run build
            cd ../frontend
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }} npm ci
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }} npm run build

            # Write production .env
            printf '%s' '${{ secrets.PROD }}' > /var/www/app/backend/.env

            # Restart PM2 processes
            cd /var/www/app/backend
            pm2 describe backend > /dev/null 2>&1 && pm2 restart backend || pm2 start "npm run start" --name="backend"
            pm2 delete Frontend 2>/dev/null || true
            pm2 serve /var/www/app/frontend/dist 3000 --name="Frontend" --spa
            pm2 save
            pm2 startup | tail -1 | sudo bash || true

            sudo cp /var/www/app/nginx.conf /etc/nginx/sites-available/app
            sudo ln -sfn /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
            sudo nginx -t && sudo systemctl reload nginx
